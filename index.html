<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project hexion</title>
  <style>
    :root {
      --bg: #0e1d33;
      --bg-deep: #111f36;
      --fg: #f4f8ff;
      --accent: #77bcfb;
      --accent-2: #66adf2;
      --accent-3: #22c55e;
      --muted: #7190bc;
      --panel: #0c192b;
      --glass: #152239;
      --glass-border: #1f3350;
      --btn-depth: 34px;          /* thickness of the 3D button */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ---------- Animated background ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* Fine dot field that drifts slowly, with a dark vignette at the edges */
    .bg .grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(119, 188, 251, 0.14) 1px, transparent 1.2px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
      animation: gridMove 12s linear infinite;
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(8, 18, 32, 0.7) 100%);
    }

    /* ---------- Content card ---------- */
    main {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: clamp(32px, 6vw, 60px) clamp(20px, 6vw, 64px);
      max-width: 640px;
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 20px 40px rgba(0, 0, 0, 0.5);
      animation: cardIn 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    h1 {
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--fg);
      animation: fadeIn 0.8s ease-out both;
    }

    p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1rem;
    }

    /* ---------- Download button (real 3D slab) ---------- */
    .download-wrap {
      margin-top: 40px;
      display: inline-block;
      perspective: 1000px;
    }

    .download-btn {
      /* Driven by JS on hover; reset to rest values here */
      --mx: 50%;
      --my: 50%;
      --rx: 0deg;
      --ry: 0deg;
      --tx: 0px;
      --ty: 0px;
      --lift: 0px;

      position: relative;
      display: inline-block;
      padding: 44px 110px;
      font-size: clamp(1.4rem, 4.5vw, 2.1rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-decoration: none;
      border-radius: 12px;
      transform-style: preserve-3d;
      transform: translate3d(var(--tx), var(--ty), var(--lift))
                 rotateX(var(--rx)) rotateY(var(--ry));
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s backwards;
      will-change: transform;
      cursor: pointer;
    }

    .download-btn:hover {
      transition: transform 0.12s ease-out;
    }

    /* Invisible hit area: extends the hover zone 32px beyond the button */
    .download-btn::before {
      content: "";
      position: absolute;
      inset: -32px;
      border-radius: 48px;
    }

    /* Stacked layers form the thickness of the slab (the "sides") */
    .download-btn .layer {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, #14803c, #0a5a29);
      transform: translateZ(var(--z));
    }

    /* Front face: the part you see and click */
    .download-btn .face {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(135deg, #34d870, #16a34a 60%, #15803d);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35),
                  inset 0 -3px 0 rgba(0, 0, 0, 0.18);
      transform: translateZ(var(--btn-depth));
      transform-style: preserve-3d;
    }

    /* Specular highlight that follows the cursor */
    .download-btn .face::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at var(--mx) var(--my),
                  rgba(255, 255, 255, 0.45), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .download-btn:hover .face::after {
      opacity: 1;
    }

    /* Shine sweep, clipped to the rounded face */
    .download-btn .shine {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      overflow: hidden;
      pointer-events: none;
    }

    .download-btn .shine::before {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg);
      transition: left 0.7s ease;
    }

    .download-btn:hover .shine::before {
      left: 130%;
    }

    /* Label floats above the face for depth */
    .download-btn .label {
      position: relative;
      display: inline-block;
      transform: translateZ(14px);
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
      transition: text-shadow 0.3s ease;
    }

    .download-btn:hover .label {
      text-shadow: 0 8px 16px rgba(0, 0, 0, 0.35);
    }

    .download-btn:active {
      transform: translate3d(var(--tx), calc(var(--ty) + 4px), 0) rotateX(var(--rx)) rotateY(var(--ry));
    }

    .download-btn:focus-visible {
      outline: 3px solid #86efac;
      outline-offset: 6px;
    }

    /* ---------- Rat walk overlay (plays on Download click) ---------- */
    .rat-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(6, 12, 22, 0.9);
      perspective: 900px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .rat-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .rat {
      position: absolute;
      left: 0;
      top: 50%;
      width: 380px;
      height: 260px;
      margin-top: -130px;
      transform-style: preserve-3d;
      transform: translateX(-420px);
    }

    .rat-overlay.active .rat {
      animation: ratWalk 2.6s linear forwards;
    }

    .rat-inner {
      width: 100%;
      height: 100%;
    }

    .rat-overlay.active .rat-inner {
      animation: bob 0.4s ease-in-out infinite alternate;
    }

    .rat svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Walk cycle: near legs and far legs are half a cycle apart */
    .rat-overlay.active .leg {
      animation: legA 0.4s ease-in-out infinite alternate;
    }

    .rat-overlay.active .shin {
      animation: shinA 0.4s ease-in-out infinite alternate;
    }

    .rat-overlay.active .p1 {
      animation-delay: -0.4s;
    }

    .rat-overlay.active .tail {
      animation: tailWave 0.45s ease-in-out infinite alternate;
    }

    .rat-overlay.active .lid {
      animation: blink 3.2s infinite;
    }

    @keyframes ratWalk {
      from { transform: translateX(-420px) rotateY(12deg); }
      to   { transform: translateX(calc(100vw + 420px)) rotateY(-12deg); }
    }

    @keyframes bob {
      from { transform: translateY(0) rotateX(5deg); }
      to   { transform: translateY(-7px) rotateX(-3deg); }
    }

    @keyframes legA {
      from { transform: rotate(-24deg); }
      to   { transform: rotate(24deg); }
    }

    @keyframes shinA {
      from { transform: rotate(16deg); }
      to   { transform: rotate(-18deg); }
    }

    @keyframes tailWave {
      from { transform: rotate(-7deg); }
      to   { transform: rotate(9deg); }
    }

    @keyframes blink {
      0%, 93%, 100% { transform: scaleY(0); }
      96%           { transform: scaleY(1); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.6) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Moves exactly one tile (28px) diagonally so the loop is seamless */
    @keyframes gridMove {
      from { background-position: 0 0; }
      to   { background-position: 28px 28px; }
    }

    @media (max-width: 480px) {
      .download-btn { padding: 32px 64px; }
    }

    @media (prefers-reduced-motion: reduce) {
      h1, .download-btn, main, .bg .grid { animation: none; }
      .download-btn { transition: none; transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="grid"></div>
  </div>

  <main>
    <h1>Project Hexion</h1>
    <div class="download-wrap">
      <a id="download-btn" class="download-btn" href="/download/" draggable="false">
        <span class="face">
          <span class="shine"></span>
          <span class="label">Download Hexion</span>
        </span>
      </a>
    </div>
  </main>

  <div id="rat-overlay" class="rat-overlay" aria-hidden="true">
    <div class="rat">
      <div class="rat-inner">
        <svg viewBox="0 0 380 260" aria-hidden="true">
          <defs>
            <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e6eaf1"/>
              <stop offset="0.5" stop-color="#8a909c"/>
              <stop offset="1" stop-color="#3b414d"/>
            </linearGradient>
            <radialGradient id="gHead" cx="0.35" cy="0.3" r="0.8">
              <stop offset="0" stop-color="#eef1f6"/>
              <stop offset="0.55" stop-color="#7a808c"/>
              <stop offset="1" stop-color="#3b414d"/>
            </radialGradient>
            <linearGradient id="gLeg" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#7b8290"/>
              <stop offset="1" stop-color="#3a404c"/>
            </linearGradient>
            <linearGradient id="gLegFar" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#4c5260"/>
              <stop offset="1" stop-color="#262a34"/>
            </linearGradient>
            <linearGradient id="gTail" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#e3a7b5"/>
              <stop offset="1" stop-color="#8f5e6d"/>
            </linearGradient>
            <radialGradient id="gEar" cx="0.5" cy="0.4" r="0.7">
              <stop offset="0" stop-color="#f3c0cb"/>
              <stop offset="1" stop-color="#c98297"/>
            </radialGradient>
            <radialGradient id="gNose" cx="0.35" cy="0.35" r="0.7">
              <stop offset="0" stop-color="#ffc7d4"/>
              <stop offset="1" stop-color="#b4456b"/>
            </radialGradient>
            <linearGradient id="gSnout" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#c5cbd6"/>
              <stop offset="1" stop-color="#6c7280"/>
            </linearGradient>
            <radialGradient id="gEye" cx="0.4" cy="0.35" r="0.7">
              <stop offset="0" stop-color="#4a3f40"/>
              <stop offset="1" stop-color="#050506"/>
            </radialGradient>
            <pattern id="fur" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
              <path d="M1 6 Q2 3 2.6 0.5" stroke="rgba(255,255,255,0.22)" stroke-width="0.9" fill="none"/>
              <path d="M4.6 7 Q5.4 4 5.9 1.5" stroke="rgba(0,0,0,0.15)" stroke-width="0.8" fill="none"/>
            </pattern>
            <clipPath id="eyeClip"><circle cx="254" cy="102" r="5.6"/></clipPath>
            <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="4"/>
            </filter>
          </defs>

          <!-- ground shadow -->
          <ellipse cx="190" cy="236" rx="120" ry="9" fill="#000" opacity="0.55" filter="url(#soft)"/>

          <!-- tail: a curved stroke with ring pattern on top, waving from its base -->
          <g class="tail" style="transform-origin: 80px 150px;">
            <path d="M80 150 C44 160 22 140 16 110 C10 86 18 70 8 52" fill="none" stroke="url(#gTail)" stroke-width="7" stroke-linecap="round"/>
            <path d="M80 150 C44 160 22 140 16 110 C10 86 18 70 8 52" fill="none" stroke="#6e4452" stroke-width="7" stroke-dasharray="3 4" opacity="0.55"/>
            <path d="M80 150 C44 160 22 140 16 110 C10 86 18 70 8 52" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" stroke-linecap="round" transform="translate(0,-1.5)"/>
          </g>

          <!-- far legs (behind the body) -->
          <g class="leg p1" style="transform-origin: 142px 164px;">
            <path d="M142 164 L136 200" stroke="url(#gLegFar)" stroke-width="13" stroke-linecap="round"/>
            <g class="shin" style="transform-origin: 136px 200px;">
              <path d="M136 200 L140 222" stroke="url(#gLegFar)" stroke-width="10" stroke-linecap="round"/>
              <ellipse cx="145" cy="224" rx="8" ry="4" fill="#5d6472"/>
            </g>
          </g>
          <g class="leg" style="transform-origin: 232px 162px;">
            <path d="M232 162 L228 198" stroke="url(#gLegFar)" stroke-width="13" stroke-linecap="round"/>
            <g class="shin" style="transform-origin: 228px 198px;">
              <path d="M228 198 L234 222" stroke="url(#gLegFar)" stroke-width="10" stroke-linecap="round"/>
              <ellipse cx="237" cy="224" rx="8" ry="4" fill="#5d6472"/>
            </g>
          </g>

          <!-- body -->
          <ellipse cx="170" cy="136" rx="84" ry="44" fill="url(#gBody)"/>
          <ellipse cx="170" cy="136" rx="84" ry="44" fill="url(#fur)" opacity="0.7"/>
          <ellipse cx="128" cy="140" rx="40" ry="38" fill="rgba(30,34,44,0.38)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <ellipse cx="128" cy="140" rx="40" ry="38" fill="url(#fur)" opacity="0.5"/>
          <ellipse cx="222" cy="126" rx="24" ry="22" fill="rgba(255,255,255,0.12)"/>
          <ellipse cx="172" cy="170" rx="66" ry="14" fill="#d4d9e2" opacity="0.55"/>
          <ellipse cx="160" cy="96" rx="62" ry="6" fill="#ffffff" opacity="0.22" filter="url(#soft)"/>

          <!-- near back leg -->
          <g class="leg p1" style="transform-origin: 122px 166px;">
            <path d="M122 166 L112 202" stroke="url(#gLeg)" stroke-width="15" stroke-linecap="round"/>
            <g class="shin" style="transform-origin: 112px 202px;">
              <path d="M112 202 L118 224" stroke="url(#gLeg)" stroke-width="12" stroke-linecap="round"/>
              <ellipse cx="124" cy="227" rx="9" ry="4.5" fill="#8f96a3"/>
              <path d="M125 227 l1 3 M122 227 l0 3 M119 227 l-1 3" stroke="#e9e4d6" stroke-width="1" stroke-linecap="round"/>
            </g>
          </g>

          <!-- head -->
          <ellipse cx="252" cy="110" rx="36" ry="33" fill="url(#gHead)"/>
          <ellipse cx="252" cy="110" rx="36" ry="33" fill="url(#fur)" opacity="0.6"/>
          <ellipse cx="262" cy="124" rx="18" ry="12" fill="#e9ecf2" opacity="0.5"/>
          <path d="M236 92 Q248 86 262 92" stroke="#2c3038" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

          <!-- ears -->
          <ellipse cx="236" cy="78" rx="13" ry="14" fill="#6f7685"/>
          <ellipse cx="248" cy="80" rx="13" ry="14" fill="url(#gEar)" stroke="#7d8390" stroke-width="1.5"/>
          <ellipse cx="249" cy="81" rx="8" ry="9" fill="#fbd3dc" opacity="0.85"/>
          <path d="M249 74 Q247 80 249 88" stroke="rgba(190,100,120,0.45)" stroke-width="0.8" fill="none"/>

          <!-- snout, nose, mouth, teeth -->
          <path d="M270 110 Q296 108 308 120 Q306 128 292 130 Q276 132 268 128 Z" fill="url(#gSnout)"/>
          <path d="M290 130 Q298 132 304 127" stroke="#3a3f4b" stroke-width="1" fill="none"/>
          <path d="M292 130 L293.5 141 L296.5 130 Z" fill="#fff3c4" stroke="#b9a660" stroke-width="0.6"/>
          <ellipse cx="306" cy="119" rx="5.5" ry="4.8" fill="url(#gNose)"/>
          <circle cx="304" cy="117" r="1.4" fill="#ffffff" opacity="0.8"/>

          <!-- whiskers -->
          <g stroke="rgba(235,240,250,0.85)" stroke-width="0.9" stroke-linecap="round" fill="none">
            <path d="M304 119 Q330 108 360 102"/>
            <path d="M305 121 Q332 118 362 116"/>
            <path d="M305 123 Q332 128 360 132"/>
            <path d="M303 125 Q328 138 352 150"/>
          </g>

          <!-- eye with highlight, rim and blink lid -->
          <circle cx="254" cy="102" r="5.6" fill="url(#gEye)"/>
          <circle cx="252.2" cy="100.2" r="1.6" fill="#ffffff"/>
          <circle cx="254" cy="102" r="6.4" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>
          <rect class="lid" x="246" y="95" width="16" height="13" fill="#5b6170" clip-path="url(#eyeClip)" style="transform-origin: 254px 95px;"/>

          <!-- near front leg (in front of body) -->
          <g class="leg" style="transform-origin: 206px 166px;">
            <path d="M206 166 L204 200" stroke="url(#gLeg)" stroke-width="15" stroke-linecap="round"/>
            <g class="shin" style="transform-origin: 204px 200px;">
              <path d="M204 200 L212 224" stroke="url(#gLeg)" stroke-width="12" stroke-linecap="round"/>
              <ellipse cx="218" cy="227" rx="9" ry="4.5" fill="#8f96a3"/>
              <path d="M219 227 l1 3 M216 227 l0 3 M213 227 l-1 3" stroke="#e9e4d6" stroke-width="1" stroke-linecap="round"/>
            </g>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Block dragging of links, images and selected content
      document.addEventListener('dragstart', function (e) {
        e.preventDefault();
      });

      var btn = document.getElementById('download-btn');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!btn) return;

      // Clicking Download Hexion plays the rat walk, then opens /download/
      btn.addEventListener('click', function (e) {
        if (reduce) return;
        e.preventDefault();
        document.getElementById('rat-overlay').classList.add('active');
        setTimeout(function () {
          window.location.href = btn.getAttribute('href');
        }, 2800);
      });

      // Build the slab's thickness: layers stacked behind the front face.
      var LAYERS = 28;
      var depth = 34;
      var fragment = document.createDocumentFragment();
      for (var i = 0; i < LAYERS; i++) {
        var layer = document.createElement('span');
        layer.className = 'layer';
        layer.setAttribute('aria-hidden', 'true');
        // Spread evenly from the back of the slab to just under the face
        layer.style.setProperty('--z', (-(i / (LAYERS - 1)) * depth + depth - 0.5) + 'px');
        fragment.appendChild(layer);
      }
      btn.insertBefore(fragment, btn.firstChild);

      if (reduce) return;

      // 3D hover: the slab lifts toward the viewer, tilts toward the cursor,
      // sinks slightly, and its highlight follows the pointer.
      btn.addEventListener('mousemove', function (e) {
        var r = btn.getBoundingClientRect();
        // Clamp to the button's edges so the hit area's margin
        // doesn't tilt the button further than its own edge.
        var px = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        var py = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
        var x = px - 0.5;
        var y = py - 0.5;

        btn.style.setProperty('--ry', (x * 30).toFixed(2) + 'deg');
        btn.style.setProperty('--rx', (-y * 30).toFixed(2) + 'deg');
        btn.style.setProperty('--tx', (x * 10).toFixed(2) + 'px');
        btn.style.setProperty('--ty', (6 + y * 4).toFixed(2) + 'px');
        btn.style.setProperty('--lift', '34px');
        btn.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
        btn.style.setProperty('--my', (py * 100).toFixed(1) + '%');
      });

      btn.addEventListener('mouseleave', function () {
        btn.style.setProperty('--rx', '0deg');
        btn.style.setProperty('--ry', '0deg');
        btn.style.setProperty('--tx', '0px');
        btn.style.setProperty('--ty', '0px');
        btn.style.setProperty('--lift', '0px');
        btn.style.setProperty('--mx', '50%');
        btn.style.setProperty('--my', '50%');
      });
    })();
  </script>
</body>
</html>
