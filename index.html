<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bighexion.Pro</title>
  <style>
    :root {
      --bg: #070910;
      --fg: #f5f7fa;
      --accent: #7c5cff;
      --accent-2: #00d4ff;
      --accent-3: #22c55e;
      --muted: #9aa3b2;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --btn-depth: 34px;          /* thickness of the 3D button */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(180deg, #0c0e16 0%, #06070c 100%);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* ---------- Animated background ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* Fine dot field that drifts slowly, with a dark vignette at the edges */
    .bg .grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.10) 1px, transparent 1.2px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
      animation: gridMove 40s linear infinite;
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.6) 100%);
    }

    /* ---------- Content card ---------- */
    main {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: clamp(32px, 6vw, 60px) clamp(20px, 6vw, 64px);
      max-width: 640px;
      width: 100%;
      background: #0e1019;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 20px 40px rgba(0, 0, 0, 0.5);
      animation: cardIn 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    h1 {
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: #ffffff;
      animation: fadeIn 0.8s ease-out both;
    }

    p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1rem;
    }

    #clock {
      margin-top: 28px;
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    /* ---------- Download button (real 3D slab) ---------- */
    .download-wrap {
      margin-top: 40px;
      display: inline-block;
      perspective: 1000px;
    }

    .download-btn {
      /* Driven by JS on hover; reset to rest values here */
      --mx: 50%;
      --my: 50%;
      --rx: 0deg;
      --ry: 0deg;
      --tx: 0px;
      --ty: 0px;
      --lift: 0px;

      position: relative;
      display: inline-block;
      padding: 44px 110px;
      font-size: clamp(1.4rem, 4.5vw, 2.1rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-decoration: none;
      border-radius: 12px;
      transform-style: preserve-3d;
      transform: translate3d(var(--tx), var(--ty), var(--lift))
                 rotateX(var(--rx)) rotateY(var(--ry));
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s backwards;
      will-change: transform;
      cursor: pointer;
    }

    .download-btn:hover {
      transition: transform 0.12s ease-out;
    }

    /* Invisible hit area: extends the hover zone 32px beyond the button */
    .download-btn::before {
      content: "";
      position: absolute;
      inset: -32px;
      border-radius: 48px;
    }

    /* Stacked layers form the thickness of the slab (the "sides") */
    .download-btn .layer {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, #14803c, #0a5a29);
      transform: translateZ(var(--z));
    }

    /* Front face: the part you see and click */
    .download-btn .face {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(135deg, #34d870, #16a34a 60%, #15803d);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35),
                  inset 0 -3px 0 rgba(0, 0, 0, 0.18);
      transform: translateZ(var(--btn-depth));
      transform-style: preserve-3d;
    }

    /* Specular highlight that follows the cursor */
    .download-btn .face::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at var(--mx) var(--my),
                  rgba(255, 255, 255, 0.45), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .download-btn:hover .face::after {
      opacity: 1;
    }

    /* Shine sweep, clipped to the rounded face */
    .download-btn .shine {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      overflow: hidden;
      pointer-events: none;
    }

    .download-btn .shine::before {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg);
      transition: left 0.7s ease;
    }

    .download-btn:hover .shine::before {
      left: 130%;
    }

    /* Label floats above the face for depth */
    .download-btn .label {
      position: relative;
      display: inline-block;
      transform: translateZ(14px);
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
      transition: text-shadow 0.3s ease;
    }

    .download-btn:hover .label {
      text-shadow: 0 8px 16px rgba(0, 0, 0, 0.35);
    }

    .download-btn:active {
      transform: translate3d(var(--tx), calc(var(--ty) + 4px), 0) rotateX(var(--rx)) rotateY(var(--ry));
    }

    .download-btn:focus-visible {
      outline: 3px solid #86efac;
      outline-offset: 6px;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.6) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(60px, -40px) scale(1.08); }
      66%      { transform: translate(-40px, 50px) scale(0.94); }
    }

    @keyframes gridMove {
      from { background-position: 0 0; }
      to   { background-position: 0 48px; }
    }

    @media (max-width: 480px) {
      .download-btn { padding: 32px 64px; }
    }

    @media (prefers-reduced-motion: reduce) {
      h1, .download-btn, main, .orb, .bg .grid { animation: none; }
      .download-btn { transition: none; transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="grid"></div>
  </div>

  <main>
    <h1>Bighexion.Pro</h1>
    <p>Welcome.</p>
    <div class="download-wrap">
      <a id="download-btn" class="download-btn" href="hexion.zip" download>
        <span class="face">
          <span class="shine"></span>
          <span class="label">Download Hexion</span>
        </span>
      </a>
    </div>
    <div id="clock" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      var clock = document.getElementById('clock');
      function tick() {
        clock.textContent = new Date().toLocaleTimeString();
      }
      tick();
      setInterval(tick, 1000);

      var btn = document.getElementById('download-btn');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!btn) return;

      // Build the slab's thickness: layers stacked behind the front face.
      var LAYERS = 28;
      var depth = parseFloat(getComputedStyle(document.documentElement)
                    .getPropertyValue('--btn-depth')) || 16;
      var fragment = document.createDocumentFragment();
      for (var i = 0; i < LAYERS; i++) {
        var layer = document.createElement('span');
        layer.className = 'layer';
        layer.setAttribute('aria-hidden', 'true');
        // Spread evenly from the back of the slab to just under the face
        layer.style.setProperty('--z', (-(i / (LAYERS - 1)) * depth + depth - 0.5) + 'px');
        fragment.appendChild(layer);
      }
      btn.insertBefore(fragment, btn.firstChild);

      if (reduce) return;

      // 3D hover: the slab lifts toward the viewer, tilts toward the cursor,
      // sinks slightly, and its highlight follows the pointer.
      btn.addEventListener('mousemove', function (e) {
        var r = btn.getBoundingClientRect();
        // Clamp to the button's edges so the hit area's margin
        // doesn't tilt the button further than its own edge.
        var px = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        var py = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
        var x = px - 0.5;
        var y = py - 0.5;

        btn.style.setProperty('--ry', (x * 30).toFixed(2) + 'deg');
        btn.style.setProperty('--rx', (-y * 30).toFixed(2) + 'deg');
        btn.style.setProperty('--tx', (x * 10).toFixed(2) + 'px');
        btn.style.setProperty('--ty', (6 + y * 4).toFixed(2) + 'px');
        btn.style.setProperty('--lift', '34px');
        btn.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
        btn.style.setProperty('--my', (py * 100).toFixed(1) + '%');
      });

      btn.addEventListener('mouseleave', function () {
        btn.style.setProperty('--rx', '0deg');
        btn.style.setProperty('--ry', '0deg');
        btn.style.setProperty('--tx', '0px');
        btn.style.setProperty('--ty', '0px');
        btn.style.setProperty('--lift', '0px');
        btn.style.setProperty('--mx', '50%');
        btn.style.setProperty('--my', '50%');
      });
    })();
  </script>
</body>
</html>
