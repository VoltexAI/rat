<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project hexion</title>
  <style>
    :root {
      --bg: #0e1d33;
      --bg-deep: #111f36;
      --fg: #f4f8ff;
      --accent: #77bcfb;
      --accent-2: #66adf2;
      --accent-3: #22c55e;
      --muted: #7190bc;
      --panel: #0c192b;
      --glass: #152239;
      --glass-border: #1f3350;
      --btn-depth: 34px;          /* thickness of the 3D button */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ---------- Animated background ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* Fine dot field that drifts slowly, with a dark vignette at the edges */
    .bg .grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(119, 188, 251, 0.14) 1px, transparent 1.2px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
      animation: gridMove 12s linear infinite;
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(8, 18, 32, 0.7) 100%);
    }

    /* ---------- Content card ---------- */
    main {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: clamp(32px, 6vw, 60px) clamp(20px, 6vw, 64px);
      max-width: 640px;
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 20px 40px rgba(0, 0, 0, 0.5);
      animation: cardIn 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    h1 {
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--fg);
      animation: fadeIn 0.8s ease-out both;
    }

    p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1rem;
    }

    /* ---------- Download button (real 3D slab) ---------- */
    .download-wrap {
      margin-top: 40px;
      display: inline-block;
      perspective: 1000px;
    }

    .download-btn {
      /* Driven by JS on hover; reset to rest values here */
      --mx: 50%;
      --my: 50%;
      --rx: 0deg;
      --ry: 0deg;
      --tx: 0px;
      --ty: 0px;
      --lift: 0px;

      position: relative;
      display: inline-block;
      padding: 44px 110px;
      font-size: clamp(1.4rem, 4.5vw, 2.1rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-decoration: none;
      border-radius: 12px;
      transform-style: preserve-3d;
      transform: translate3d(var(--tx), var(--ty), var(--lift))
                 rotateX(var(--rx)) rotateY(var(--ry));
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s backwards;
      will-change: transform;
      cursor: pointer;
    }

    .download-btn:hover {
      transition: transform 0.12s ease-out;
    }

    /* Invisible hit area: extends the hover zone 32px beyond the button */
    .download-btn::before {
      content: "";
      position: absolute;
      inset: -32px;
      border-radius: 48px;
    }

    /* Stacked layers form the thickness of the slab (the "sides") */
    .download-btn .layer {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, #14803c, #0a5a29);
      transform: translateZ(var(--z));
    }

    /* Front face: the part you see and click */
    .download-btn .face {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(135deg, #34d870, #16a34a 60%, #15803d);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35),
                  inset 0 -3px 0 rgba(0, 0, 0, 0.18);
      transform: translateZ(var(--btn-depth));
      transform-style: preserve-3d;
    }

    /* Specular highlight that follows the cursor */
    .download-btn .face::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at var(--mx) var(--my),
                  rgba(255, 255, 255, 0.45), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .download-btn:hover .face::after {
      opacity: 1;
    }

    /* Shine sweep, clipped to the rounded face */
    .download-btn .shine {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      overflow: hidden;
      pointer-events: none;
    }

    .download-btn .shine::before {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg);
      transition: left 0.7s ease;
    }

    .download-btn:hover .shine::before {
      left: 130%;
    }

    /* Label floats above the face for depth */
    .download-btn .label {
      position: relative;
      display: inline-block;
      transform: translateZ(14px);
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
      transition: text-shadow 0.3s ease;
    }

    .download-btn:hover .label {
      text-shadow: 0 8px 16px rgba(0, 0, 0, 0.35);
    }

    .download-btn:active {
      transform: translate3d(var(--tx), calc(var(--ty) + 4px), 0) rotateX(var(--rx)) rotateY(var(--ry));
    }

    .download-btn:focus-visible {
      outline: 3px solid #86efac;
      outline-offset: 6px;
    }

    /* ---------- Rat walk overlay (plays on Download click) ---------- */
    .rat-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(6, 12, 22, 0.9);
      perspective: 900px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .rat-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .rat {
      position: absolute;
      left: 0;
      top: 50%;
      width: 320px;
      height: 220px;
      margin-top: -110px;
      transform-style: preserve-3d;
      transform: translateX(-340px);
    }

    .rat-overlay.active .rat {
      animation: ratWalk 2.6s linear forwards;
    }

    .rat-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .rat-overlay.active .rat-inner {
      animation: bob 0.4s ease-in-out infinite alternate;
    }

    .rat div {
      position: absolute;
    }

    /* Body */
    .rat .body {
      left: 70px; top: 62px;
      width: 160px; height: 94px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 40% 25%, #dfe3ea 0%, #8a909c 42%, #4b505c 86%);
      box-shadow: inset -14px -16px 26px rgba(0, 0, 0, 0.45),
                  inset 8px 8px 14px rgba(255, 255, 255, 0.12);
    }

    .rat .body::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        repeating-linear-gradient(112deg, rgba(255, 255, 255, 0.09) 0 1.5px, transparent 1.5px 6px),
        repeating-linear-gradient(68deg, rgba(0, 0, 0, 0.08) 0 1px, transparent 1px 9px);
    }

    .rat .spine {
      left: 20px; top: 10px;
      width: 130px; height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.24);
      filter: blur(2px);
    }

    .rat .belly {
      left: 40px; top: 56px;
      width: 100px; height: 26px;
      border-radius: 50%;
      background: linear-gradient(#f0f2f6, #aab0bb);
      opacity: 0.65;
    }

    .rat .haunch {
      left: 14px; top: 22px;
      width: 76px; height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 60% 40%, #6d7480, #343843 70%);
      box-shadow: inset -6px -6px 12px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0, 0, 0, 0.15);
    }

    .rat .shoulder {
      left: 104px; top: 18px;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, 0.25), transparent 65%);
    }

    /* Tail: nested segments so each one bends from the one before it */
    .rat .tail {
      left: 62px; top: 118px;
      width: 18px; height: 7px;
      border-radius: 4px;
      background: repeating-linear-gradient(90deg, #c98ea0 0 7px, #9d6a79 7px 10px);
      transform-origin: 100% 50%;
      transform: rotate(-22deg) translateZ(-8px);
    }

    .rat .seg {
      left: -15px; top: 0;
      height: 7px;
      border-radius: 4px;
      background: repeating-linear-gradient(90deg, #c98ea0 0 7px, #9d6a79 7px 10px);
      transform-origin: 100% 50%;
    }

    .rat .s1 { width: 16px; }
    .rat .s2 { width: 14px; }
    .rat .s3 { width: 12px; }
    .rat .s4 { width: 10px; }
    .rat .s5 { width: 8px; }
    .rat .s6 { width: 6px; }

    .rat-overlay.active .tail,
    .rat-overlay.active .seg {
      animation: tailWave 0.45s ease-in-out infinite alternate;
    }

    .rat-overlay.active .s1 { animation-delay: -0.08s; }
    .rat-overlay.active .s2 { animation-delay: -0.16s; }
    .rat-overlay.active .s3 { animation-delay: -0.24s; }
    .rat-overlay.active .s4 { animation-delay: -0.32s; }
    .rat-overlay.active .s5 { animation-delay: -0.40s; }
    .rat-overlay.active .s6 { animation-delay: -0.48s; }

    /* Head */
    .rat .head {
      left: 196px; top: 34px;
      width: 84px; height: 76px;
      border-radius: 50% 50% 46% 46%;
      background: radial-gradient(circle at 36% 30%, #e2e5ec, #6c7280 68%, #3f4450 100%);
      box-shadow: inset -8px -8px 16px rgba(0, 0, 0, 0.4);
      transform: translateZ(14px);
    }

    .rat .head::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: repeating-linear-gradient(120deg, rgba(255, 255, 255, 0.07) 0 1.5px, transparent 1.5px 6px);
    }

    .rat .cheek {
      left: 40px; top: 38px;
      width: 40px; height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #f2f4f8, #b8bec9);
      opacity: 0.6;
    }

    .rat .brow {
      left: 36px; top: 16px;
      width: 38px; height: 6px;
      border-radius: 3px;
      background: #2f333c;
      transform: rotate(-8deg);
      opacity: 0.6;
    }

    /* Ears */
    .rat .ear-back {
      left: 220px; top: 14px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #7d8390;
      transform: translateZ(6px);
    }

    .rat .ear {
      left: 236px; top: 18px;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: #e8a3b3;
      box-shadow: inset -3px -3px 6px rgba(0, 0, 0, 0.15);
      transform: translateZ(12px);
    }

    .rat .inner-ear {
      left: 6px; top: 6px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #fbd3dc, #d98aa0);
    }

    /* Snout, nose, teeth */
    .rat .snout {
      left: 252px; top: 70px;
      width: 60px; height: 30px;
      border-radius: 50% 30% 30% 50% / 50% 40% 40% 50%;
      background: linear-gradient(#a5abb7, #6c7280);
      box-shadow: inset 0 -4px 6px rgba(0, 0, 0, 0.2);
      transform: translateZ(18px);
    }

    .rat .nose {
      left: 300px; top: 72px;
      width: 13px; height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffb3c6, #c24d6e);
      transform: translateZ(26px);
    }

    .rat .nose::after {
      content: "";
      position: absolute;
      left: 3px; top: 2px;
      width: 4px; height: 3px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
    }

    .rat .tooth {
      left: 284px; top: 96px;
      width: 9px; height: 14px;
      border-radius: 0 0 4px 4px;
      background: linear-gradient(#fff6c8, #e0cf7e);
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.15);
      transform: translateZ(20px);
    }

    /* Eye with highlight and blink lid */
    .rat .eye {
      left: 242px; top: 54px;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #3a2f2f, #0a0708 70%);
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.35);
      transform: translateZ(22px);
      overflow: hidden;
    }

    .rat .eye::after {
      content: "";
      position: absolute;
      left: 3px; top: 3px;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: #ffffff;
    }

    .rat .lid {
      left: 0; top: 0;
      width: 13px; height: 13px;
      background: linear-gradient(#5b6170, #343a46);
      transform-origin: 50% 0;
      transform: scaleY(0);
    }

    .rat-overlay.active .lid {
      animation: blink 3.2s infinite;
    }

    /* Whiskers */
    .rat .whisker {
      left: 300px;
      width: 56px; height: 1.4px;
      background: rgba(235, 240, 250, 0.8);
      transform-origin: 0 50%;
    }

    .rat .w1 { top: 72px; transform: translateZ(28px) rotate(-16deg); }
    .rat .w2 { top: 76px; transform: translateZ(28px) rotate(-4deg); }
    .rat .w3 { top: 80px; transform: translateZ(28px) rotate(8deg); }
    .rat .w4 { top: 84px; transform: translateZ(28px) rotate(18deg); }

    /* Legs: thigh (.leg) with a shin (.shin) and paw; far legs sit behind */
    .rat .leg {
      top: 136px;
      width: 18px; height: 40px;
      border-radius: 9px;
      background: linear-gradient(90deg, #666d7b, #3a404c);
      transform-origin: 50% 0;
    }

    .rat .shin {
      left: 1px; top: 34px;
      width: 16px; height: 36px;
      border-radius: 8px;
      background: linear-gradient(90deg, #5d6472, #343945);
      transform-origin: 50% 0;
    }

    .rat .paw {
      left: -3px; top: 32px;
      width: 24px; height: 10px;
      border-radius: 6px;
      background: #8a909c;
      box-shadow: inset -8px 0 0 rgba(0, 0, 0, 0.2);
    }

    .rat .paw::after {
      content: "";
      position: absolute;
      left: 20px; top: 2px;
      width: 4px; height: 3px;
      border-radius: 2px;
      background: #e9e4d6;
    }

    .rat .l1 { left: 100px; }
    .rat .l2 { left: 200px; }
    .rat .l3 { left: 112px; transform: translateZ(-10px); background: linear-gradient(90deg, #4c5260, #2a2f3a); }
    .rat .l4 { left: 212px; transform: translateZ(-10px); background: linear-gradient(90deg, #4c5260, #2a2f3a); }

    .rat-overlay.active .leg {
      animation: legSwing 0.4s ease-in-out infinite alternate;
    }

    .rat-overlay.active .shin {
      animation: shinSwing 0.4s ease-in-out infinite alternate;
    }

    .rat-overlay.active .l2,
    .rat-overlay.active .l4 {
      animation-delay: -0.4s;
    }

    .rat-overlay.active .l2 .shin,
    .rat-overlay.active .l4 .shin {
      animation-delay: -0.4s;
    }

    .rat .rat-shadow {
      left: 60px; top: 200px;
      width: 210px; height: 16px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      filter: blur(5px);
      transform: translateZ(-12px);
    }

    @keyframes ratWalk {
      from { transform: translateX(-340px) rotateY(16deg); }
      to   { transform: translateX(calc(100vw + 340px)) rotateY(-16deg); }
    }

    @keyframes bob {
      from { transform: translateY(0) rotateX(6deg); }
      to   { transform: translateY(-8px) rotateX(-4deg); }
    }

    @keyframes legSwing {
      from { transform: rotate(-24deg); }
      to   { transform: rotate(24deg); }
    }

    @keyframes shinSwing {
      from { transform: rotate(14deg); }
      to   { transform: rotate(-18deg); }
    }

    @keyframes tailWave {
      from { transform: rotate(-8deg); }
      to   { transform: rotate(8deg); }
    }

    @keyframes blink {
      0%, 94%, 100% { transform: scaleY(0); }
      97%           { transform: scaleY(1); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.6) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Moves exactly one tile (28px) diagonally so the loop is seamless */
    @keyframes gridMove {
      from { background-position: 0 0; }
      to   { background-position: 28px 28px; }
    }

    @media (max-width: 480px) {
      .download-btn { padding: 32px 64px; }
    }

    @media (prefers-reduced-motion: reduce) {
      h1, .download-btn, main, .bg .grid { animation: none; }
      .download-btn { transition: none; transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="grid"></div>
  </div>

  <main>
    <h1>Project Hexion</h1>
    <div class="download-wrap">
      <a id="download-btn" class="download-btn" href="/download/" draggable="false">
        <span class="face">
          <span class="shine"></span>
          <span class="label">Download Hexion</span>
        </span>
      </a>
    </div>
  </main>

  <div id="rat-overlay" class="rat-overlay" aria-hidden="true">
    <div class="rat">
      <div class="rat-inner">
        <div class="rat-shadow"></div>

        <div class="tail"><div class="seg s1"><div class="seg s2"><div class="seg s3"><div class="seg s4"><div class="seg s5"><div class="seg s6"></div></div></div></div></div></div></div>

        <div class="leg l3"><div class="shin"><div class="paw"></div></div></div>
        <div class="leg l4"><div class="shin"><div class="paw"></div></div></div>

        <div class="body">
          <div class="spine"></div>
          <div class="belly"></div>
          <div class="haunch"></div>
          <div class="shoulder"></div>
        </div>

        <div class="leg l1"><div class="shin"><div class="paw"></div></div></div>
        <div class="leg l2"><div class="shin"><div class="paw"></div></div></div>

        <div class="ear-back"></div>
        <div class="ear"><div class="inner-ear"></div></div>

        <div class="head">
          <div class="cheek"></div>
          <div class="brow"></div>
        </div>

        <div class="snout"></div>
        <div class="nose"></div>
        <div class="tooth"></div>
        <div class="eye"><div class="lid"></div></div>

        <div class="whisker w1"></div>
        <div class="whisker w2"></div>
        <div class="whisker w3"></div>
        <div class="whisker w4"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Block dragging of links, images and selected content
      document.addEventListener('dragstart', function (e) {
        e.preventDefault();
      });

      var btn = document.getElementById('download-btn');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!btn) return;

      // Clicking Download Hexion plays the rat walk, then opens /download/
      btn.addEventListener('click', function (e) {
        if (reduce) return;
        e.preventDefault();
        document.getElementById('rat-overlay').classList.add('active');
        setTimeout(function () {
          window.location.href = btn.getAttribute('href');
        }, 2800);
      });

      // Build the slab's thickness: layers stacked behind the front face.
      var LAYERS = 28;
      var depth = 34;
      var fragment = document.createDocumentFragment();
      for (var i = 0; i < LAYERS; i++) {
        var layer = document.createElement('span');
        layer.className = 'layer';
        layer.setAttribute('aria-hidden', 'true');
        // Spread evenly from the back of the slab to just under the face
        layer.style.setProperty('--z', (-(i / (LAYERS - 1)) * depth + depth - 0.5) + 'px');
        fragment.appendChild(layer);
      }
      btn.insertBefore(fragment, btn.firstChild);

      if (reduce) return;

      // 3D hover: the slab lifts toward the viewer, tilts toward the cursor,
      // sinks slightly, and its highlight follows the pointer.
      btn.addEventListener('mousemove', function (e) {
        var r = btn.getBoundingClientRect();
        // Clamp to the button's edges so the hit area's margin
        // doesn't tilt the button further than its own edge.
        var px = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        var py = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
        var x = px - 0.5;
        var y = py - 0.5;

        btn.style.setProperty('--ry', (x * 30).toFixed(2) + 'deg');
        btn.style.setProperty('--rx', (-y * 30).toFixed(2) + 'deg');
        btn.style.setProperty('--tx', (x * 10).toFixed(2) + 'px');
        btn.style.setProperty('--ty', (6 + y * 4).toFixed(2) + 'px');
        btn.style.setProperty('--lift', '34px');
        btn.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
        btn.style.setProperty('--my', (py * 100).toFixed(1) + '%');
      });

      btn.addEventListener('mouseleave', function () {
        btn.style.setProperty('--rx', '0deg');
        btn.style.setProperty('--ry', '0deg');
        btn.style.setProperty('--tx', '0px');
        btn.style.setProperty('--ty', '0px');
        btn.style.setProperty('--lift', '0px');
        btn.style.setProperty('--mx', '50%');
        btn.style.setProperty('--my', '50%');
      });
    })();
  </script>
