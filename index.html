<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project hexion</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    :root {
      --bg: #0e1d33;
      --bg-deep: #111f36;
      --fg: #f4f8ff;
      --accent: #77bcfb;
      --muted: #7190bc;
      --glass: #152239;
      --glass-border: #1f3350;
      --btn-depth: 34px;          /* thickness of the 3D button */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ---------- Animated background ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* Fine dot field that drifts slowly, with a dark vignette at the edges */
    .bg .grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(119, 188, 251, 0.14) 1px, transparent 1.2px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
      animation: gridMove 12s linear infinite;
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(8, 18, 32, 0.7) 100%);
    }

    /* ---------- Stage: a 1200x800 design that scales to fit the window ---------- */
    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1200px;
      height: 800px;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%) scale(var(--s, 1));
      transform-origin: center center;
    }

    /* ---------- Content card ---------- */
    main {
      position: relative;
      text-align: center;
      padding: 60px 64px;
      max-width: 640px;
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 20px 40px rgba(0, 0, 0, 0.5);
      animation: cardIn 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    h1 {
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--fg);
      animation: fadeIn 0.8s ease-out both;
    }

    /* ---------- Download button (real 3D slab) ---------- */
    .download-wrap {
      margin-top: 40px;
      display: inline-block;
      perspective: 1000px;
    }

    .download-btn {
      /* Driven by JS on hover; reset to rest values here */
      --mx: 50%;
      --my: 50%;
      --rx: 0deg;
      --ry: 0deg;
      --tx: 0px;
      --ty: 0px;
      --lift: 0px;

      position: relative;
      display: inline-block;
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-decoration: none;
      border-radius: 12px;
      white-space: nowrap;
      transform-style: preserve-3d;
      transform: translate3d(var(--tx), var(--ty), var(--lift))
                 rotateX(var(--rx)) rotateY(var(--ry));
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s backwards;
      will-change: transform;
      cursor: pointer;
    }

    .download-btn:hover {
      transition: transform 0.12s ease-out;
    }

    /* Invisible hit area: extends the hover zone 32px beyond the button */
    .download-btn::before {
      content: "";
      position: absolute;
      inset: -32px;
      border-radius: 48px;
    }

    /* Stacked layers form the thickness of the slab (the "sides") */
    .download-btn .layer {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, #14803c, #0a5a29);
      transform: translateZ(var(--z));
    }

    /* Front face: the part you see and click */
    .download-btn .face {
      position: relative;
      width: 320px;
      padding: 28px 44px;
      border-radius: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(135deg, #34d870, #16a34a 60%, #15803d);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35),
                  inset 0 -3px 0 rgba(0, 0, 0, 0.18);
      transform: translateZ(var(--btn-depth));
      transform-style: preserve-3d;
    }

    /* Specular highlight that follows the cursor */
    .download-btn .face::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at var(--mx) var(--my),
                  rgba(255, 255, 255, 0.45), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .download-btn:hover .face::after {
      opacity: 1;
    }

    /* Shine sweep, clipped to the rounded face */
    .download-btn .shine {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      overflow: hidden;
      pointer-events: none;
    }

    .download-btn .shine::before {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg);
      transition: left 0.7s ease;
    }

    .download-btn:hover .shine::before {
      left: 130%;
    }

    /* Label floats above the face for depth */
    .download-btn .label {
      position: relative;
      display: inline-block;
      transform: translateZ(14px);
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
      transition: text-shadow 0.3s ease;
    }

    .download-btn:hover .label {
      text-shadow: 0 8px 16px rgba(0, 0, 0, 0.35);
    }

    .download-btn:active {
      transform: translate3d(var(--tx), calc(var(--ty) + 4px), 0) rotateX(var(--rx)) rotateY(var(--ry));
    }

    .download-btn:focus-visible {
      outline: 3px solid #86efac;
      outline-offset: 6px;
    }

    /* ---------- Rat overlay: static 3D rat at the bottom of the screen ---------- */
    .rat-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(6, 12, 22, 0.88);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .rat-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    #rat-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.6) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Moves exactly one tile (28px) diagonally so the loop is seamless */
    @keyframes gridMove {
      from { background-position: 0 0; }
      to   { background-position: 28px 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      h1, .download-btn, main, .bg .grid { animation: none; }
      .download-btn { transition: none; transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="grid"></div>
  </div>

  <div class="stage" id="stage">
    <main>
      <h1>Project Hexion</h1>
      <div class="download-wrap">
        <a id="download-btn" class="download-btn" href="/download/" draggable="false">
          <span class="face">
            <span class="shine"></span>
            <span class="label">Download Hexion</span>
          </span>
        </a>
      </div>
    </main>
  </div>

  <div id="rat-overlay" class="rat-overlay" aria-hidden="true">
    <canvas id="rat-canvas"></canvas>
  </div>

  <script>
    (function () {
      // Scale the 1200x800 stage to fit the browser window
      var stage = document.getElementById('stage');
      function fit() {
        var s = Math.min(window.innerWidth / 1800, window.innerHeight / 1100) * 0.94;
        s = Math.max(0.5, Math.min(s, 1.6));
        stage.style.setProperty('--s', s.toFixed(4));
      }
      fit();
      window.addEventListener('resize', fit);
      // Scale the label font so the text fills the button's width (up or down)
      function fitLabels() {
        document.querySelectorAll('.stage .label').forEach(function (label) {
          var face = label.parentElement;
          label.style.fontSize = '';
          var faceCS = getComputedStyle(face);
          var avail = face.clientWidth
            - parseFloat(faceCS.paddingLeft) - parseFloat(faceCS.paddingRight);
          var base = parseFloat(getComputedStyle(label).fontSize);
          var w = label.offsetWidth;
          if (avail > 0 && w > 0) {
            label.style.fontSize = (base * avail / w * 0.96).toFixed(2) + 'px';
          }
        });
      }
      fitLabels();
      window.addEventListener('resize', fitLabels);

      // Block dragging of links, images and selected content
      document.addEventListener('dragstart', function (e) {
        e.preventDefault();
      });

      var btn = document.getElementById('download-btn');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!btn) return;

      // Clicking Download Hexion shows the rat at the bottom, then opens /download/
      btn.addEventListener('click', function (e) {
        if (reduce) return;
        e.preventDefault();
        document.getElementById('rat-overlay').classList.add('active');
        if (window.dropRat) window.dropRat();
        setTimeout(function () {
          window.location.href = btn.getAttribute('href');
        }, 1300);
      });

      // Build the slab's thickness: layers stacked behind the front face.
      var LAYERS = 28;
      var depth = 34;
      var fragment = document.createDocumentFragment();
      for (var i = 0; i < LAYERS; i++) {
        var layer = document.createElement('span');
        layer.className = 'layer';
        layer.setAttribute('aria-hidden', 'true');
        layer.style.setProperty('--z', (-(i / (LAYERS - 1)) * depth + depth - 0.5) + 'px');
        fragment.appendChild(layer);
      }
      btn.insertBefore(fragment, btn.firstChild);

      if (reduce) return;

      // 3D hover: the slab lifts toward the viewer, tilts toward the cursor,
      // sinks slightly, and its highlight follows the pointer.
      btn.addEventListener('mousemove', function (e) {
        var r = btn.getBoundingClientRect();
        // Clamp to the button's edges so the hit area's margin
        // doesn't tilt the button further than its own edge.
        var px = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        var py = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
        var x = px - 0.5;
        var y = py - 0.5;

        btn.style.setProperty('--ry', (x * 30).toFixed(2) + 'deg');
        btn.style.setProperty('--rx', (-y * 30).toFixed(2) + 'deg');
        btn.style.setProperty('--tx', (x * 10).toFixed(2) + 'px');
        btn.style.setProperty('--ty', (6 + y * 4).toFixed(2) + 'px');
        btn.style.setProperty('--lift', '34px');
        btn.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
        btn.style.setProperty('--my', (py * 100).toFixed(1) + '%');
      });

      btn.addEventListener('mouseleave', function () {
        btn.style.setProperty('--rx', '0deg');
        btn.style.setProperty('--ry', '0deg');
        btn.style.setProperty('--tx', '0px');
        btn.style.setProperty('--ty', '0px');
        btn.style.setProperty('--lift', '0px');
        btn.style.setProperty('--mx', '50%');
        btn.style.setProperty('--my', '50%');
      });
    })();
  </script>

  <script type="module">
    // 3D rat driven by Matter.js (2D rigid-body physics): drops from above the screen,
    // is pushed by wind, tumbles and bounces off the bottom edge, then rests upright.
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    var Engine = window.Matter.Engine;
    var Bodies = window.Matter.Bodies;
    var Body = window.Matter.Body;
    var Composite = window.Matter.Composite;

    var canvas = document.getElementById('rat-canvas');
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
    camera.position.set(0, 0, 6);

    scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x1a2233, 1.4));
    var key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(3, 5, 4);
    scene.add(key);
    var fill = new THREE.DirectionalLight(0x77bcfb, 0.8);
    fill.position.set(-4, 2, -3);
    scene.add(fill);

    var pivot = new THREE.Group();   // the rat's position and tilt, copied from the physics body
    scene.add(pivot);

    var rat = null;
    var modelSize = new THREE.Vector3(1, 1, 1);
    var center = new THREE.Vector3();

    // Physics: Matter.js works in pixels; PX pixels = 1 world unit. Matter's y points down.
    var PX = 100;
    var engine = Engine.create({ enableSleeping: false });
    engine.gravity.y = 1;
    engine.gravity.scale = 0.001;
    var walls = [];
    var ratBody = null;

    var halfH = 1, halfW = 1;        // visible half-extents of the screen (world units)
    var halfX = 0.5, halfY = 0.2;    // rat half-extents after scaling (world units)

    var running = false, pendingDrop = false;
    var t = 0, acc = 0, last = 0, settledAt = null, windSign = 1;

    function wrap(a) {
      return Math.atan2(Math.sin(a), Math.cos(a));
    }

    function metrics() {
      halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
      halfW = halfH * camera.aspect;
      if (rat) {
        // Rat length: about 45% of the width, at most 35% of the height
        var L = Math.min(halfW * 2 * 0.45, halfH * 2 * 0.35);
        var longest = Math.max(modelSize.x, modelSize.y, modelSize.z);
        var s = L / longest;
        rat.scale.setScalar(s);
        rat.position.copy(center).multiplyScalar(-s);
        halfX = modelSize.x * s / 2;
        halfY = modelSize.y * s / 2;
      }
    }

    function floorPx() {
      return halfH * 0.96 * PX;      // bottom edge of the screen, in physics pixels
    }

    function buildWalls() {
      if (walls.length) Composite.remove(engine.world, walls);
      var f = floorPx();
      walls = [
        Bodies.rectangle(0, f + 50, 4000, 100, { isStatic: true, friction: 0.8 }),
        Bodies.rectangle(-halfW * PX - 50, 0, 100, 4000, { isStatic: true }),
        Bodies.rectangle(halfW * PX + 50, 0, 100, 4000, { isStatic: true })
      ];
      Composite.add(engine.world, walls);
    }

    function spawnRat() {
      if (ratBody) Composite.remove(engine.world, ratBody);
      var hx = halfX * PX, hy = halfY * PX;
      windSign = Math.random() < 0.5 ? -1 : 1;   // each drop is pushed by a gust in a random direction
      ratBody = Bodies.rectangle(
        0,                             // drop in the middle of the screen
        -halfH * PX - hy - 40,         // start fully above the top edge
        2 * hx, 2 * hy,
        { chamfer: { radius: hy * 0.9 }, restitution: 0.35, friction: 0.8, frictionAir: 0.02, density: 0.001 }
      );
      Composite.add(engine.world, ratBody);
      Body.setAngle(ratBody, (Math.random() - 0.5) * 0.1);
      Body.setAngularVelocity(ratBody, (Math.random() - 0.5) * 0.01);
      Body.setVelocity(ratBody, { x: (Math.random() - 0.5) * 0.2, y: 0 });
    }

    function placeMesh() {
      if (!ratBody) return;
      pivot.position.set(ratBody.position.x / PX, -ratBody.position.y / PX, 0);
      pivot.rotation.z = -ratBody.angle;
    }

    // One physics step (1/60 s): wind, righting after landing, then Matter.js
    function simStep() {
      t += 1 / 60;
      var grounded = ratBody.bounds.max.y >= floorPx() - 2;

      if (t < 2.5 && !grounded) {
        var windX = windSign * (0.6 * Math.sin(t * 0.9) + 0.3 * Math.sin(t * 2.3 + 1.1));
        Body.applyForce(ratBody, ratBody.position, { x: windX * 0.0002 * ratBody.mass, y: 0 });
        // Pushing near the top adds torque, so the rat tumbles in the wind
        Body.applyForce(ratBody, { x: ratBody.position.x, y: ratBody.position.y - halfY * PX },
          { x: windX * 0.00006 * ratBody.mass, y: 0 });
      }

      // In the air, a gentle spring pulls the rat toward upright so it lands on its feet
      if (!grounded) {
        Body.setAngularVelocity(ratBody, ratBody.angularVelocity - 0.002 * wrap(ratBody.angle) - 0.03 * ratBody.angularVelocity);
      }

      Engine.update(engine, 1000 / 60);

      var still = grounded
        && Math.abs(ratBody.angularVelocity) < 0.002
        && Math.hypot(ratBody.velocity.x, ratBody.velocity.y) < 0.05
        && Math.abs(wrap(ratBody.angle)) < 0.03;
      if (still && t > 3 && settledAt === null) settledAt = t;
      if ((settledAt !== null && t > settledAt + 0.5) || t > 8) {
        running = false;             // the rat stays where it came to rest
      }
    }

    function loop(now) {
      var frame = Math.min(0.05, (now - last) / 1000);
      last = now;
      acc += frame;
      while (acc >= 1 / 60 && running) {
        simStep();
        acc -= 1 / 60;
      }
      placeMesh();
      renderer.render(scene, camera);
      if (running) requestAnimationFrame(loop);
    }

    function startDrop() {
      metrics();
      buildWalls();
      spawnRat();
      t = 0; acc = 0; settledAt = null;
      running = true;
      last = performance.now();
      requestAnimationFrame(loop);
    }

    function layout() {
      var w = window.innerWidth;
      var h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      metrics();
      if (!running) {
        // Idle: show the rat resting on the bottom of the screen
        pivot.position.set(0, -halfH * 0.96 + halfY, 0);
        pivot.rotation.z = 0;
      }
      renderer.render(scene, camera);
    }

    // Called by the Download button
    window.dropRat = function () {
      if (!rat) { pendingDrop = true; return; }
      startDrop();
    };

    new GLTFLoader().load('rat/street_rat_1k.gltf', function (gltf) {
      rat = gltf.scene;
      // The model is longest along Z; turn it so its length runs left to right on screen
      var raw = new THREE.Box3().setFromObject(rat).getSize(new THREE.Vector3());
      if (raw.z > raw.x) rat.rotation.y = Math.PI / 2;
      rat.updateMatrixWorld(true);
      var box = new THREE.Box3().setFromObject(rat);
      box.getSize(modelSize);
      box.getCenter(center);
      pivot.add(rat);
      layout();
      if (pendingDrop) { pendingDrop = false; startDrop(); }
    });

    window.addEventListener('resize', layout);
    layout();
  </script>
</body>
</html>
