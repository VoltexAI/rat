<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bighexion.Pro</title>
  <style>
    :root {
      --bg: #0f1115;
      --fg: #f5f7fa;
      --accent: #7c5cff;
      --accent-2: #00d4ff;
      --muted: #9aa3b2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    main {
      text-align: center;
    }

    h1 {
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: fadeIn 0.8s ease-out both;
    }

    p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1rem;
    }

    #clock {
      margin-top: 24px;
      font-variant-numeric: tabular-nums;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .download-wrap {
      margin-top: 32px;
      perspective: 800px;
      display: inline-block;
    }

    .download-btn {
      position: relative;
      display: inline-block;
      padding: 16px 36px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-decoration: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 8px 0 #0f7a36, 0 14px 30px rgba(34, 197, 94, 0.35);
      overflow: hidden;
      transform-style: preserve-3d;
      transform: translate(var(--tx, 0px), var(--ty, 0px)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transition: transform 0.2s ease-out, box-shadow 0.25s ease;
      animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s backwards,
                 pulse 2.4s ease-in-out 1.2s infinite;
      will-change: transform;
    }

    /* Shine sweep across the button on hover */
    .download-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      transform: skewX(-20deg);
      transition: left 0.6s ease;
      pointer-events: none;
    }

    .download-btn:hover::before {
      left: 130%;
    }

    .download-btn:hover {
      box-shadow: 0 3px 0 #0f7a36, 0 10px 24px rgba(34, 197, 94, 0.5);
    }

    .download-btn:active {
      box-shadow: 0 3px 0 #0f7a36, 0 6px 12px rgba(34, 197, 94, 0.3);
    }

    .download-btn:focus-visible {
      outline: 3px solid #86efac;
      outline-offset: 4px;
    }

    .download-btn .label {
      position: relative;
      display: inline-block;
      transform: translateZ(30px);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.6) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.12); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      h1, .download-btn { animation: none; }
      .download-btn { transition: none; transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Bighexion.Pro</h1>
    <p>Welcome.</p>
    <div class="download-wrap">
      <a id="download-btn" class="download-btn" href="hexion.zip" download>
        <span class="label">Download Hexion</span>
      </a>
    </div>
    <div id="clock" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      var clock = document.getElementById('clock');
      function tick() {
        clock.textContent = new Date().toLocaleTimeString();
      }
      tick();
      setInterval(tick, 1000);

      // 3D tilt effect on the download button
      var btn = document.getElementById('download-btn');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (btn && !reduce) {
        // While hovering: button sinks down and drifts toward the cursor,
        // tilting in 3D toward it. Resets when the mouse leaves.
        btn.addEventListener('mousemove', function (e) {
          var r = btn.getBoundingClientRect();
          var x = (e.clientX - r.left) / r.width - 0.5;   // -0.5 .. 0.5
          var y = (e.clientY - r.top) / r.height - 0.5;
          btn.style.setProperty('--ry', (x * 24).toFixed(2) + 'deg');
          btn.style.setProperty('--rx', (-y * 24).toFixed(2) + 'deg');
          btn.style.setProperty('--tx', (x * 14).toFixed(2) + 'px');
          btn.style.setProperty('--ty', (6 + y * 6).toFixed(2) + 'px');
        });
        btn.addEventListener('mouseleave', function () {
          btn.style.setProperty('--rx', '0deg');
          btn.style.setProperty('--ry', '0deg');
          btn.style.setProperty('--tx', '0px');
          btn.style.setProperty('--ty', '0px');
        });
      }
    })();
  </script>
</body>
</html>
