<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hexion Download</title>
  <style>
    :root {
      --bg: #0e1d33;
      --bg-deep: #111f36;
      --fg: #f4f8ff;
      --accent: #77bcfb;
      --muted: #7190bc;
      --glass: #152239;
      --glass-border: #1f3350;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    main {
      text-align: center;
      max-width: 560px;
      width: 100%;
      padding: clamp(32px, 6vw, 56px) clamp(20px, 6vw, 56px);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    p {
      margin-top: 14px;
      color: var(--muted);
    }

    a.back {
      display: inline-block;
      margin-top: 28px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    a.back:hover { text-decoration: underline; }
    a.back:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Hexion is Current Unavailable</h1>
    <p>Please check back later.</p>
    <a class="back" href="/">&larr; Back to Project Hexion</a>
  </main>
</body>
</html>
