<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project hexion</title>
  <style>
    :root {
      --bg: #0e1d33;
      --bg-deep: #111f36;
      --fg: #f4f8ff;
      --accent: #77bcfb;
      --accent-2: #66adf2;
      --accent-3: #22c55e;
      --muted: #7190bc;
      --panel: #0c192b;
      --glass: #152239;
      --glass-border: #1f3350;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ---------- Animated background ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* Fine dot field that drifts slowly, with a dark vignette at the edges */
    .bg .grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(119, 188, 251, 0.14) 1px, transparent 1.2px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
      animation: gridMove 12s linear infinite;
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(8, 18, 32, 0.7) 100%);
    }

    /* ---------- Content card ---------- */
    main {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: clamp(32px, 6vw, 60px) clamp(20px, 6vw, 64px);
      max-width: 640px;
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 20px 40px rgba(0, 0, 0, 0.5);
      animation: cardIn 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    h1 {
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--fg);
      animation: fadeIn 0.8s ease-out both;
    }

    p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1rem;
    }

    /* ---------- Blue 3D back button ---------- */
    .back-btn {
      position: relative;
      display: inline-block;
      margin-top: 36px;
      padding: 18px 42px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-decoration: none;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(135deg, #8ec5fb, #3d8fe0 60%, #2f74c4);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35),
                  0 8px 0 #1d5ea6,
                  0 14px 26px rgba(61, 143, 224, 0.35);
      transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
    }

    .back-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg);
      transition: left 0.7s ease;
      pointer-events: none;
    }

    .back-btn:hover {
      transform: translateY(-3px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35),
                  0 11px 0 #1d5ea6,
                  0 18px 30px rgba(61, 143, 224, 0.5);
    }

    .back-btn:hover::before { left: 130%; }

    .back-btn:active {
      transform: translateY(5px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35),
                  0 2px 0 #1d5ea6;
    }

    .back-btn:focus-visible {
      outline: 3px solid #bfdcff;
      outline-offset: 6px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes gridMove {
      from { background-position: 0 0; }
      to   { background-position: 28px 28px; }
    }

    @media (max-width: 480px) {
      .back-btn { padding: 16px 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      h1, main, .bg .grid { animation: none; }
      .back-btn, .back-btn::before { transition: none; }
      .back-btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="grid"></div>
  </div>

  <main>
    <h1>Hexion is Current Unavailable</h1>
    <p>Please check back later.</p>
    <a class="back-btn" href="https://www.bighexion.pro/">&larr; Back to Project Hexion</a>
  </main>
</body>
</html>
