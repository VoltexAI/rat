<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hexion Download</title>
  <style>
    :root {
      --bg: #0e1d33;
      --bg-deep: #111f36;
      --fg: #f4f8ff;
      --accent: #77bcfb;
      --muted: #7190bc;
      --glass: #152239;
      --glass-border: #1f3350;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    main {
      text-align: center;
      max-width: 560px;
      width: 100%;
      padding: clamp(32px, 6vw, 56px) clamp(20px, 6vw, 56px);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    p {
      margin-top: 14px;
      color: var(--muted);
    }

    /* Blue 3D button, styled like the Download Hexion button */
    .back-btn {
      position: relative;
      display: inline-block;
      margin-top: 36px;
      padding: 18px 42px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-decoration: none;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(135deg, #8ec5fb, #3d8fe0 60%, #2f74c4);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35),
                  0 8px 0 #1d5ea6,
                  0 14px 26px rgba(61, 143, 224, 0.35);
      transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
    }

    .back-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg);
      transition: left 0.7s ease;
      pointer-events: none;
    }

    .back-btn:hover {
      transform: translateY(-3px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35),
                  0 11px 0 #1d5ea6,
                  0 18px 30px rgba(61, 143, 224, 0.5);
    }

    .back-btn:hover::before { left: 130%; }

    .back-btn:active {
      transform: translateY(5px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35),
                  0 2px 0 #1d5ea6;
    }

    .back-btn:focus-visible {
      outline: 3px solid #bfdcff;
      outline-offset: 6px;
    }

    @media (max-width: 480px) {
      .back-btn { padding: 16px 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .back-btn, .back-btn::before { transition: none; }
      .back-btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Hexion is Current Unavailable</h1>
    <p>Please check back later.</p>
    <a class="back-btn" href="https://www.bighexion.pro/">&larr; Back to Project Hexion</a>
  </main>
</body>
</html>
